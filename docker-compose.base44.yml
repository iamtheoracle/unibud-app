services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: unibud
      POSTGRES_PASSWORD: unibud
      POSTGRES_DB: unibud
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unibud"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:8080"
    environment:
      - DATABASE_URL=postgresql://unibud:unibud@db:5432/unibud
      - VITE_AUTH_ENABLED=false
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npm run db:migrate && npm run dev"
    restart: unless-stopped

volumes:
  pgdata:
