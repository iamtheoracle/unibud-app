# Netlify build configuration for this TanStack Start + Nitro app.
#
# Nitro auto-selects its `netlify` preset here, which splits the build into:
#   - static client assets -> dist/            (the publish directory)
#   - the SSR handler      -> .netlify/functions-internal/server/server.mjs
#     (Netlify picks that up automatically; it is not the `functions` dir)
#
# `publish` must therefore be `dist`, not `dist/client`.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
