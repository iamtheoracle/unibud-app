name: Refresh npm lockfile

on:
  push:
    branches:
      - maintenance/refresh-npm-lockfile

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.23.4
          cache: npm
      - name: Regenerate lockfile without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reviewed lockfile candidate
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push
